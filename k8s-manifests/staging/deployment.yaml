apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-lab-flask
  namespace: staging
  labels:
    app: ci-lab-flask
spec:
  replicas: 2
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 300
  selector:
    matchLabels:
      app: ci-lab-flask
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ci-lab-flask
      annotations:
        lab3/source-revision: bootstrap
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: amd64
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: schema-init
        image: ghcr.io/shumlesha/ci-lab-1-flask-staging:bootstrap
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -m
        - flask
        - --app
        - app:create_app
        - init-db
        envFrom:
        - secretRef:
            name: lab3-app
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 256Mi
      containers:
      - name: app
        image: ghcr.io/shumlesha/ci-lab-1-flask-staging:bootstrap
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 5000
        envFrom:
        - secretRef:
            name: lab3-app
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 256Mi
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 2
          timeoutSeconds: 2
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 5
          timeoutSeconds: 4
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 64Mi
