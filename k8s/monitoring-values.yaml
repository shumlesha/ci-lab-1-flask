grafana:
  enabled: false
alertmanager:
  enabled: false
prometheus:
  prometheusSpec:
    retention: 2h
    podMonitorSelector:
      matchLabels:
        release: monitoring
    podMonitorNamespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: staging
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: '1'
        memory: 1Gi
