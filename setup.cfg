# =========================================================
# САМОСТОЯТЕЛЬНАЯ РАБОТА
# =========================================================
#
# Настройте здесь pytest/pytest-cov так, чтобы Pipeline
# завершался с ошибкой, если покрытие кода меньше 80%.
#
# Используйте требования раздела 5.3 лабораторной работы.
# =========================================================

[tool:pytest]
testpaths = tests
addopts =
    -ra
    --strict-config
    --strict-markers
    --cov=app
    --cov-config=setup.cfg
    --cov-report=term-missing
    --cov-report=xml:reports/coverage.xml
    --cov-report=html:reports/htmlcov
    --cov-report=markdown:reports/coverage.md
    --junitxml=reports/junit.xml

[coverage:run]
branch = True
relative_files = True

[coverage:report]
fail_under = 80
precision = 2
show_missing = True

[flake8]
max-line-length = 88
extend-exclude =
    .venv,
    venv,
    __pycache__,
    build,
    dist,
    reports,
    *.egg-info